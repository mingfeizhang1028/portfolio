<script>
(()=>{
  const page=document.getElementById('page'),canvas=document.getElementById('space'),fallback=document.getElementById('fallback');
  const gl=canvas.getContext('webgl2',{alpha:true,antialias:true,powerPreference:'high-performance'});
  if(!gl){fallback.classList.add('show');if(window.parent!==window)window.parent.postMessage({type:'orbit-unsupported'},'*');return}
  const VERT=`#version 300 es
    precision highp float;layout(location=0)in vec3 aPos;layout(location=1)in vec3 aNormal;
    uniform mat4 uModel,uVP;out vec3 vPos,vNorm,vLocal;
    void main(){vec4 p=uModel*vec4(aPos,1.0);vPos=p.xyz;vNorm=normalize(mat3(uModel)*aNormal);vLocal=aPos;gl_Position=uVP*p;}`;
  const FRAG=`#version 300 es
    precision highp float;in vec3 vPos,vNorm,vLocal;out vec4 outColor;
    uniform vec3 uColor,uEye,uEdgeColor;uniform float uDim,uCore,uAccent,uRadius,uWidth,uRough;
    const float PI=3.14159265359;
    vec3 fresnel(float cosTheta,vec3 f0){return f0+(1.0-f0)*pow(1.0-cosTheta,5.0);}
    float distributionGGX(float nh,float rough){float a=rough*rough,a2=a*a,d=nh*nh*(a2-1.0)+1.0;return a2/max(PI*d*d,.0001);}
    float geometrySchlick(float nv,float rough){float k=(rough+1.0)*(rough+1.0)/8.0;return nv/(nv*(1.0-k)+k);}
    vec3 softbox(vec3 r){
      vec3 sky=mix(vec3(.018,.027,.040),vec3(.074,.106,.139),smoothstep(-.9,.85,r.y));
      float broad=pow(max(dot(r,normalize(vec3(-.55,.75,.58))),0.0),15.0);
      float narrow=pow(max(dot(r,normalize(vec3(.67,.36,.71))),0.0),85.0);
      float strip=exp(-pow((r.x+.24)*7.0,2.0))*smoothstep(-.62,.05,r.y)*(1.0-smoothstep(.42,.95,r.y));
      float lower=pow(max(dot(r,normalize(vec3(.18,-.8,.45))),0.0),30.0);
      float upperRight=pow(max(dot(r,normalize(vec3(.78,.72,.52))),0.0),11.0);
      return sky+vec3(.70,.80,.86)*broad*.98+vec3(.62,.78,.88)*narrow*1.45+vec3(.38,.48,.58)*strip*.62+vec3(.13,.18,.24)*lower*.32+vec3(.56,.75,.81)*upperRight*.75;
    }
    vec3 lightSpec(vec3 n,vec3 v,vec3 l,vec3 f0,float rough,vec3 radiance){
      vec3 h=normalize(v+l);float nl=max(dot(n,l),0.0),nv=max(dot(n,v),.001),nh=max(dot(n,h),0.0),hv=max(dot(h,v),0.0);
      float d=distributionGGX(nh,rough),g=geometrySchlick(nv,rough)*geometrySchlick(nl,rough);
      return (d*g*fresnel(hv,f0)/max(4.0*nv*nl,.001))*radiance*nl;
    }
    void main(){
      vec3 n=normalize(vNorm),v=normalize(uEye-vPos),r=reflect(-v,n);
      float nv=max(dot(n,v),.001),edge=0.0;
      if(uRadius>0.1){edge=smoothstep(.67,.97,abs(length(vLocal.xy)-uRadius)/max(uWidth,.001));}
      float rough=mix(uRough,max(.12,uRough*.53),edge);
      vec3 f0=uCore>.5?vec3(.045,.07,.095):uColor;
      vec3 reflected=softbox(r)*fresnel(nv,f0)*(1.0-rough*.32);
      vec3 direct=lightSpec(n,v,normalize(vec3(-.65,.72,1.1)),f0,rough,vec3(1.28,1.44,1.58));
      direct+=lightSpec(n,v,normalize(vec3(.82,.65,.72)),f0,rough,vec3(.72,.94,1.05));
      vec3 base;
      float alpha=1.0;
      if(uCore>.5){
        float rim=pow(1.0-nv,2.7);
        base=vec3(.012,.024,.041)+reflected*.84+direct*.83+vec3(.13,.21,.29)*rim;
        alpha=.66+.24*rim;
      }else{
        float grain=sin(length(vLocal.xy)*460.0)*.014+sin(length(vLocal.xy)*930.0)*.006;
        base=reflected+direct+uColor*(.015+.018*max(n.y,0.0)+grain);
        base+=uEdgeColor*(.072+.24*pow(1.0-nv,1.8)+.52*edge);
        base+=uColor*uAccent*.024;
      }
      base=mix(base,vec3(.003,.006,.011),uDim);
      base=base/(base+vec3(.75));
      outColor=vec4(pow(max(base,vec3(0.0)),vec3(1.0/2.2)),alpha);
    }`;
  function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
  let program;try{program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,VERT));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,FRAG));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));}catch(e){console.error(e);fallback.classList.add('show');return}
  gl.useProgram(program);gl.enable(gl.DEPTH_TEST);gl.enable(gl.CULL_FACE);gl.cullFace(gl.BACK);gl.clearColor(0,0,0,0);
  const loc={model:gl.getUniformLocation(program,'uModel'),vp:gl.getUniformLocation(program,'uVP'),color:gl.getUniformLocation(program,'uColor'),eye:gl.getUniformLocation(program,'uEye'),edge:gl.getUniformLocation(program,'uEdgeColor'),dim:gl.getUniformLocation(program,'uDim'),core:gl.getUniformLocation(program,'uCore'),accent:gl.getUniformLocation(program,'uAccent'),radius:gl.getUniformLocation(program,'uRadius'),width:gl.getUniformLocation(program,'uWidth'),rough:gl.getUniformLocation(program,'uRough')};
